project:
  name: gene_primer_design
  target_gene: gene
  version: "2026-06-01"

runtime:
  ncbi_email: "you@example.org"
  work_dir: "../../work/production_gene"
  output_dir: "../../out/production_gene"
  reports_dir: "../../reports/production_gene"
  downloads_dir: "../../downloads/production_gene"

tools:
  datasets_bin: "datasets"
  mafft_bin: "mafft"
  blastn_bin: "blastn"
  makeblastdb_bin: "makeblastdb"
  blastdbcmd_bin: "blastdbcmd"

specificity_db:
  out_prefix: "../../blastdb/gene_specificity_panel"
  title: "gene production specificity panel"
  dbtype: "nucl"
  blastdb_version: 5
  parse_seqids: true
  subjects_file: "../../reports/production_gene/subjects.tsv"
  target_loci_file: "../../reports/production_gene/target_loci.tsv"

  ncbi_datasets:
    assembly_level:
      - complete
      - chromosome
    target_taxa:
      - "Enterococcus faecium"
      - "Enterococcus faecalis"
    near_target_taxa:
      - "Enterococcus hirae"
      - "Enterococcus durans"
      - "Enterococcus gallinarum"
      - "Enterococcus casseliflavus"
    background_taxa:
      - "Staphylococcus aureus"
      - "Streptococcus pneumoniae"
      - "Streptococcus pyogenes"
      - "Listeria monocytogenes"
      - "Lactococcus lactis"

  local_fasta:
    - path: "../../data/local_negative_panel.fna"
      role: "local_background"
    - path: "../../data/target_gene_contexts.fna"
      role: "target_context"

design:
  max_sequences: 500
  mafft_args: "--auto --nuc"
  window_size: 25
  top_quantile: 0.8
  top_n: 20

blast_specificity:
  required: true
  policy_mode: "production"
  task: "blastn-short"
  word_size: 7
  evalue: 1000
  max_target_seqs: 500
  min_hit_identity: 80.0
  min_hit_len: 12
  min_query_coverage: 0.80
  max_total_mismatches: 4
  max_total_gaps: 0
  primer_3p_tail_len: 5
  max_3p_tail_mismatches: 1
  max_3p_tail_gaps: 0
  require_predicted_on_target_amplicon: true
  reject_any_offtarget_amplicon: true
  reject_good_3prime_offtarget_amplicon: true
  pair_pool_size: 50
  pair_pool_expansion_step: 25
  top_k_unique_primers: 60
  pair_min_amplicon: 60
  pair_max_amplicon: 150
