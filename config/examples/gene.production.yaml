project:
  name: multi_gene_primer_design
  version: "2026-06-10"

runtime:
  ncbi_email: "you@example.org"
  root_dir: "../../runs/multi_gene_example"

tools:
  datasets_bin: "datasets"
  mafft_bin: "mafft"
  blastn_bin: "blastn"
  makeblastdb_bin: "makeblastdb"
  blastdbcmd_bin: "blastdbcmd"

genes:
  - gene: "gene1"
    fetch:
      query: "gene1[Gene] AND bacteria[Organism]"

    specificity_db:
      title: "gene1 production specificity panel"
      dbtype: "nucl"
      blastdb_version: 5
      parse_seqids: true

      ncbi_datasets:
        assembly_level:
          - complete
          - chromosome
        target_taxa:
          - "Enterococcus faecium"
          - "Enterococcus faecalis"
        near_target_taxa:
          - "Enterococcus hirae"
          - "Enterococcus durans"
        background_taxa:
          - "Staphylococcus aureus"
          - "Streptococcus pneumoniae"

      local_fasta:
        - path: "../../data/local_negative_panel.fna"
          role: "local_background"
        - path: "../../data/gene1_target_contexts.fna"
          role: "target_context"

    design:
      max_sequences: 500
      mafft_args: "--auto --nuc"
      window_size: 25
      top_quantile: 0.8
      top_n: 20

    blast_specificity:
      required: true
      policy_mode: "production"
      task: "blastn-short"
      word_size: 7
      evalue: 1000
      max_target_seqs: 500
      min_hit_identity: 80.0
      min_hit_len: 12
      min_query_coverage: 0.80
      max_total_mismatches: 4
      max_total_gaps: 0
      primer_3p_tail_len: 5
      max_3p_tail_mismatches: 1
      max_3p_tail_gaps: 0
      require_predicted_on_target_amplicon: true
      reject_any_offtarget_amplicon: true
      reject_good_3prime_offtarget_amplicon: true
      pair_pool_size: 50
      pair_pool_expansion_step: 25
      top_k_unique_primers: 60
      pair_min_amplicon: 60
      pair_max_amplicon: 150

  - gene: "gene2"
    fetch:
      query: "gene2[Gene] AND bacteria[Organism]"

    specificity_db:
      title: "gene2 production specificity panel"
      dbtype: "nucl"
      blastdb_version: 5
      parse_seqids: true

      ncbi_datasets:
        assembly_level:
          - complete
          - chromosome
        target_taxa:
          - "Enterococcus faecalis"
        near_target_taxa:
          - "Enterococcus gallinarum"
          - "Enterococcus casseliflavus"
        background_taxa:
          - "Staphylococcus aureus"
          - "Listeria monocytogenes"
          - "Lactococcus lactis"

      local_fasta:
        - path: "../../data/local_negative_panel.fna"
          role: "local_background"
        - path: "../../data/gene2_target_contexts.fna"
          role: "target_context"

    design:
      max_sequences: 400
      mafft_args: "--auto --nuc"
      window_size: 21
      top_quantile: 0.85
      top_n: 15

    blast_specificity:
      required: true
      policy_mode: "production"
      task: "blastn-short"
      word_size: 7
      evalue: 1000
      max_target_seqs: 500
      min_hit_identity: 78.0
      min_hit_len: 12
      min_query_coverage: 0.80
      max_total_mismatches: 4
      max_total_gaps: 0
      primer_3p_tail_len: 5
      max_3p_tail_mismatches: 1
      max_3p_tail_gaps: 0
      require_predicted_on_target_amplicon: true
      reject_any_offtarget_amplicon: true
      reject_good_3prime_offtarget_amplicon: true
      pair_pool_size: 50
      pair_pool_expansion_step: 25
      top_k_unique_primers: 60
      pair_min_amplicon: 70
      pair_max_amplicon: 180
