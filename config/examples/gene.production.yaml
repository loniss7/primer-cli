project:
  name: multi_gene_primer_design
  version: "2026-06-11"

runtime:
  ncbi_email: "you@example.org"
  root_dir: "../../runs/amr_multi_gene"
  shared_downloads_dir: "../../shared/taxon_cache/downloads"
  shared_unpack_dir: "../../shared/taxon_cache/datasets_unpack"

tools:
  datasets_bin: "datasets"
  mafft_bin: "mafft"
  blastn_bin: "blastn"
  makeblastdb_bin: "makeblastdb"
  blastdbcmd_bin: "blastdbcmd"

genes:
  - gene: "vanA"
    fetch:
      query: "vanA[Gene] AND bacteria[Organism] NOT patent[filter]"

    specificity_db:
      out_prefix: "../../shared/blastdb/vanA/vanA_specificity_panel"
      subjects_file: "../../shared/blastdb/vanA/subjects.tsv"
      title: "vanA production specificity panel"
      dbtype: "nucl"
      blastdb_version: 5
      parse_seqids: true

      ncbi_datasets:
        assembly_level:
          - complete
          - chromosome
        target_taxa:
          - "Enterococcus faecium"
          - "Enterococcus faecalis"
          - "Enterococcus durans"
          - "Enterococcus hirae"
          - "Staphylococcus aureus"
        near_target_taxa:
          - "Enterococcus gallinarum"
          - "Enterococcus casseliflavus"
          - "Enterococcus avium"
          - "Enterococcus raffinosus"
        background_taxa:
          - "Streptococcus gallolyticus"
          - "Streptococcus pneumoniae"
          - "Listeria monocytogenes"
          - "Lactococcus lactis"
          - "Clostridioides difficile"
          - "Eggerthella lenta"

      local_fasta: []

    design:
      max_sequences: 800
      mafft_args: "--auto --nuc"
      window_size: 25
      top_quantile: 0.82
      top_n: 35

    blast_specificity:
      required: true
      policy_mode: "production"
      task: "blastn-short"
      word_size: 7
      evalue: 1000
      max_target_seqs: 2500
      min_hit_identity: 75.0
      min_hit_len: 12
      min_query_coverage: 0.75
      max_total_mismatches: 5
      max_total_gaps: 0
      primer_3p_tail_len: 5
      max_3p_tail_mismatches: 1
      max_3p_tail_gaps: 0
      require_predicted_on_target_amplicon: false
      reject_any_offtarget_amplicon: true
      reject_good_3prime_offtarget_amplicon: true
      pair_pool_size: 120
      pair_pool_expansion_step: 60
      top_k_unique_primers: 140
      pair_min_amplicon: 110
      pair_max_amplicon: 240

  - gene: "vanB"
    fetch:
      query: "(vanB[Gene] OR vanB1[Gene] OR vanB2[Gene] OR vanB3[Gene]) AND bacteria[Organism] NOT patent[filter]"

    specificity_db:
      out_prefix: "../../shared/blastdb/vanB/vanB_specificity_panel"
      subjects_file: "../../shared/blastdb/vanB/subjects.tsv"
      title: "vanB production specificity panel"
      dbtype: "nucl"
      blastdb_version: 5
      parse_seqids: true

      ncbi_datasets:
        assembly_level:
          - complete
          - chromosome
        target_taxa:
          - "Enterococcus faecium"
          - "Enterococcus faecalis"
          - "Enterococcus durans"
          - "Enterococcus hirae"
          - "Eggerthella lenta"
          - "Enterocloster clostridioformis"
          - "Streptococcus gallolyticus"
          - "Clostridioides difficile"
        near_target_taxa:
          - "Enterococcus gallinarum"
          - "Enterococcus casseliflavus"
          - "Enterococcus avium"
          - "Enterococcus raffinosus"
        background_taxa:
          - "Staphylococcus aureus"
          - "Streptococcus pneumoniae"
          - "Listeria monocytogenes"
          - "Lactococcus lactis"
          - "Bacillus subtilis"
          - "Bacteroides fragilis"

      local_fasta: []

    design:
      max_sequences: 1000
      mafft_args: "--auto --nuc"
      window_size: 23
      top_quantile: 0.86
      top_n: 40

    blast_specificity:
      required: true
      policy_mode: "production"
      task: "blastn-short"
      word_size: 7
      evalue: 1000
      max_target_seqs: 2500
      min_hit_identity: 75.0
      min_hit_len: 12
      min_query_coverage: 0.75
      max_total_mismatches: 5
      max_total_gaps: 0
      primer_3p_tail_len: 5
      max_3p_tail_mismatches: 1
      max_3p_tail_gaps: 0
      require_predicted_on_target_amplicon: false
      reject_any_offtarget_amplicon: true
      reject_good_3prime_offtarget_amplicon: true
      pair_pool_size: 140
      pair_pool_expansion_step: 60
      top_k_unique_primers: 160
      pair_min_amplicon: 110
      pair_max_amplicon: 240
